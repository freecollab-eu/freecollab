name: Native client artifacts

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Public HTTPS origin for the customer mobile build (no secrets)
        required: true
        default: https://freecollab.eu
        type: string

permissions:
  contents: read

concurrency:
  group: native-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: clients/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build unsigned customer-installable artifacts
        shell: bash
        run: |
          # Installed Linux packages must be readable by ordinary desktop users.
          umask 022
          npm run dist
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'
      - name: Verify actual Linux app in an isolated local fixture
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python clients/desktop/tests/package-proof.py --directory clients/desktop/dist --report clients/desktop/dist/package-proof.json
          sudo dpkg -i clients/desktop/dist/*.deb
          python clients/desktop/tests/browser-proof.py --binary /opt/FreeCollab/freecollab --report clients/desktop/dist/browser-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-desktop-${{ runner.os }}
          path: |
            clients/desktop/dist/*.AppImage
            clients/desktop/dist/*.deb
            clients/desktop/dist/*.exe
            clients/desktop/dist/*.dmg
            clients/desktop/dist/*.zip
            clients/desktop/dist/browser-proof.json
            clients/desktop/dist/package-proof.json
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    env:
      FREECOLLAB_APP_URL: ${{ inputs.installation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-android-debug
          path: clients/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/mobile
    env:
      FREECOLLAB_APP_URL: ${{ inputs.installation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Build the real Xcode project without signing credentials
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/FreeCollab-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-ios-simulator
          path: clients/mobile/ios/FreeCollab-simulator.zip
          if-no-files-found: error
          retention-days: 30
