name: SDK release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version, matching package.json
        required: true
        type: string
      publish:
        description: Publish the verified artifact to npm next using the configured trusted publisher
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  artifact:
    name: Verify and pack the SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/components/package-lock.json
      - name: Check release identity
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release.py check --version "$RELEASE_VERSION" --require-clean --github-output "$GITHUB_OUTPUT"
      - name: Install the locked standalone package
        working-directory: packages/components
        run: npm ci --ignore-scripts
      - name: Verify public APIs and generate the exact artifact
        working-directory: packages/components
        run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-sdk-${{ steps.identity.outputs.version }}
          path: packages/components/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish reviewed SDK bytes
    needs: artifact
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'freecollab-eu/freecollab'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.artifact.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Recheck exact source and completed CI before retrieving release bytes
        env:
          RELEASE_VERSION: ${{ needs.artifact.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py check --version "$RELEASE_VERSION" --require-clean --require-ci --repository "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@v4
        with:
          name: freecollab-sdk-${{ needs.artifact.outputs.version }}
          path: artifact
      - name: Verify manifest and publish with npm OIDC
        env:
          RELEASE_VERSION: ${{ needs.artifact.outputs.version }}
        run: |
          python scripts/release.py sdk artifact --version "$RELEASE_VERSION"
          npm publish "artifact/freecollab-components-$RELEASE_VERSION.tgz" --access public --provenance --tag next --ignore-scripts
