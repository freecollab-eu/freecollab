map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 51m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Office uses a short-lived capability. Keep its path out of proxy logs.
    location ^~ /api/office-edit/ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://backend:8000/office-edit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
    }
    # OAuth authorization codes and state are one-use credentials. Suppress
    # callback query strings in both access and upstream error diagnostics.
    location = /api/personal-oauth/callback {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://backend:8000/personal-oauth/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy no-referrer always;
    }
    location /api/ {
        # OAuth callbacks and private capabilities can occur on several API
        # routes. Keep request URLs out of generic proxy diagnostics; the
        # application's bounded metadata audit remains the source for activity.
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
    # PDF.js uses an ES module worker. Nginx's default MIME map omits .mjs.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    # Fixed trusted-client entry points import versioned chunks. Revalidate on every load.
    location ~ ^/embed-entry\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /service-worker.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
