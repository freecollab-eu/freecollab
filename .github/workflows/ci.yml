name: FreeCollab CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  # Inference runs in browser WASM; no Node CUDA runtime is distributed.
  ONNXRUNTIME_NODE_INSTALL_CUDA: "skip"

jobs:
  # Backend tests
  backend-test:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    # Keep the TLS and process integration fixtures on a fixed LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: freecollab
          POSTGRES_PASSWORD: freecollab
          POSTGRES_DB: freecollab_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install TLS Redis-compatible integration fixture
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y redis-server

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://freecollab:freecollab@localhost:5432/freecollab_test
          JWT_SECRET: test-secret-key-for-ci
          VALKEY_SERVER_BIN: /usr/bin/redis-server
        run: |
          python ../scripts/test-ci-backend-tests.py
          python ../scripts/ci-backend-tests.py --shard ${{ matrix.shard }} --shards 4 -- -v --cov=app --cov-report=xml:coverage-shard-${{ matrix.shard }}.xml -o faulthandler_timeout=60 --durations=20

      - name: Retain shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/coverage-shard-${{ matrix.shard }}.xml
          retention-days: 7

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage-shard-${{ matrix.shard }}.xml
          flags: backend,coverage-shard-${{ matrix.shard }}

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run build

      - name: Client regressions and widget bundle
        working-directory: frontend
        run: |
          node --test tests/*.test.mjs
          npm run build:widget
          npm run build:website
          npm run build:demo
          npm ci --prefix ../packages/components
          npm test --prefix ../packages/components
          npm pack ../packages/components --dry-run

      - name: Install reverse proxy integration fixture
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y nginx

      - name: Verify reverse proxy capability privacy
        timeout-minutes: 3
        run: |
          python3 frontend/tests/nginx-capability-logging.py --nginx /usr/sbin/nginx --report "$RUNNER_TEMP/nginx-capability-privacy.json"

  product-e2e:
    name: Product browser and PostgreSQL workflow
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: freecollab
          POSTGRES_PASSWORD: freecollab-ci-only
          POSTGRES_DB: freecollab_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://freecollab:freecollab-ci-only@127.0.0.1:5432/freecollab_browser
      JWT_SECRET: isolated-ci-signing-key-do-not-use-for-deployment
      ENVIRONMENT: test
      PUBLIC_APP_URL: http://127.0.0.1:3000
      MAIL_DELIVERY_MODE: file
      MAIL_FILE_PATH: /tmp/freecollab-ci-mail
      ACCOUNT_MAIL_PATH: /tmp/freecollab-ci-mail
      CHAT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and browser
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/bin/python -m playwright install --with-deps chromium
          backend/.venv/bin/python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(os.path.join(os.environ['GITHUB_WORKSPACE'], 'backend', '.venv', 'bin') + '\n')
          PY
          npm ci --prefix frontend
          npm ci --prefix packages/components --ignore-scripts
          VITE_PUBLIC_DEMO_URL=http://127.0.0.1:3011/product-demo/ npm run build --prefix frontend
          npm run build:widget --prefix frontend
      - name: Install media integration fixture
        # Keep noble packages on signed official HTTPS sources for this step;
        # leave the runner's global feeds and the full codec proof unchanged.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          media_apt_dir="$(mktemp -d "$RUNNER_TEMP/freecollab-media-apt.XXXXXX")"
          trap 'sudo rm -rf -- "$media_apt_dir"' EXIT
          chmod 0755 "$media_apt_dir"
          mkdir -p "$media_apt_dir/lists/partial" "$media_apt_dir/sources.list.d"
          cat > "$media_apt_dir/ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          chmod 0644 "$media_apt_dir/ubuntu.sources"
          media_apt_options=(
            -o "Dir::Etc::sourcelist=$media_apt_dir/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$media_apt_dir/sources.list.d"
            -o "Dir::State::lists=$media_apt_dir/lists"
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${media_apt_options[@]}" update
          sudo apt-get "${media_apt_options[@]}" install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version
      - name: Start API and reference client
        run: |
          (cd backend && python -m uvicorn app.main:socket_app --host 127.0.0.1 --port 8000 --no-proxy-headers) > /tmp/freecollab-api.log 2>&1 &
          (cd backend && python -m app.services.mail) > /tmp/freecollab-mail.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1 --strictPort) > /tmp/freecollab-web.log 2>&1 &
          python - <<'PY'
          import json, time
          from urllib.request import urlopen
          deadline = time.monotonic() + 60
          while True:
              try:
                  with urlopen('http://127.0.0.1:3000/api/ready', timeout=2) as response:
                      if json.load(response)['status'] == 'ready':
                          break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)
          PY
      - name: Verify collaboration and personalized client workflows
        run: |
          python backend/scripts/smoke_core.py
          python frontend/tests/pilot-browser.py
          python frontend/tests/chat-browser.py
          python frontend/tests/widget-browser.py
          python frontend/tests/widget-security-browser.py
          python frontend/tests/appearance-browser.py
          python frontend/tests/elite-browser.py
          SCREENSHOT_DIR="$RUNNER_TEMP/freecollab-product-browser/open-studio" python frontend/tests/open-studio-browser.py
          python frontend/tests/conversation-flow-browser.py
          BACKEND_PYTHON=python python frontend/tests/slash-commands-browser.py
          BACKEND_PYTHON=python python frontend/tests/commands-references-browser.py
          BACKEND_PYTHON=python python frontend/tests/thread-commands-browser.py
          python frontend/tests/work-surface-layout-browser.py
          BACKEND_PYTHON=python python frontend/tests/workspace-modes-browser.py
          BACKEND_PYTHON=python COLLABORATION_INPUT_REPORT="$RUNNER_TEMP/freecollab-universal/collaboration-input/browser.json" python frontend/tests/collaboration-input-browser.py
          BACKEND_PYTHON=python COLLABORATION_WORKBENCH_REPORT="$RUNNER_TEMP/freecollab-universal/workbench/browser.json" python frontend/tests/collaboration-workbench-browser.py
          BACKEND_PYTHON=python COLLABORATION_MODAL_REPORT="$RUNNER_TEMP/freecollab-universal/modal/browser.json" python frontend/tests/collaboration-modal-browser.py
          BACKEND_PYTHON=python REFERENCED_MESSAGE_REPORT="$RUNNER_TEMP/freecollab-universal/reference-lifetime/browser.json" python frontend/tests/referenced-message-browser.py
          BACKEND_PYTHON=python UNIVERSAL_PROOF_REPORT="$RUNNER_TEMP/freecollab-universal/product/current.json" python frontend/tests/universal-collaboration-browser.py
          BACKEND_PYTHON=python python frontend/tests/flow-first-browser.py
          python frontend/tests/notification-browser.py
          python frontend/tests/account-browser.py
          python frontend/tests/account-race-browser.py
          python frontend/tests/history-browser.py
          python frontend/tests/files-browser.py
          python frontend/tests/office-files-browser.py
          python frontend/tests/security-operations-browser.py
          python frontend/tests/collaboration-browser.py
          python frontend/tests/integrations-browser.py
          python frontend/tests/oidc-browser.py
          python frontend/tests/customer-sso-browser.py
          python frontend/tests/embed-admin-browser.py
          BACKEND_PYTHON=python python frontend/tests/chat-productivity-browser.py
          BACKEND_PYTHON=python python frontend/tests/enterprise-search-browser.py
          BACKEND_PYTHON=python python frontend/tests/app-platform-browser.py
          BACKEND_PYTHON=python python frontend/tests/media-browser.py
          BACKEND_PYTHON=python python frontend/tests/native-client-browser.py
          BACKEND_PYTHON=python python frontend/tests/my-day-browser.py
          BACKEND_PYTHON=python python frontend/tests/calendar-planning-browser.py
          BACKEND_PYTHON=python python frontend/tests/calendar-delivery-browser.py
          BACKEND_PYTHON=python python frontend/tests/import-library-browser.py
          BACKEND_PYTHON=python PERSONAL_OAUTH_REPORT="$RUNNER_TEMP/freecollab-product-browser/personal-oauth/report.json" python frontend/tests/personal-oauth-browser.py
          BACKEND_PYTHON=python python frontend/tests/native-push-browser.py
          BACKEND_PYTHON=python python frontend/tests/native-calling-browser.py
          BACKEND_PYTHON=python python frontend/tests/offline-library-browser.py
          python frontend/tests/enterprise-onboarding-browser.py
          python frontend/tests/remote-sync-browser.py
          python frontend/tests/proofs-browser.py
          python frontend/tests/project-tasks-browser.py
          python frontend/tests/meetings-browser.py
          python frontend/tests/mobile-offline-browser.py
          python frontend/tests/shared-documents-browser.py
          python frontend/tests/workflows-browser.py
          python frontend/tests/data-controls-browser.py
          python frontend/tests/file-experience-browser.py
          python frontend/tests/activity-feed-browser.py
          python frontend/tests/cloud-files-browser.py
          python frontend/tests/cloud-picker-focus-browser.py
          python frontend/tests/external-meetings-browser.py
          python frontend/tests/copilot-browser.py
          python frontend/tests/language-browser.py
          python frontend/tests/connection-setup-browser.py
          python frontend/tests/workspace-launch-browser.py
          python frontend/tests/workspace-feedback-browser.py
          python frontend/tests/connection-health-browser.py
          BACKEND_PYTHON=python python frontend/tests/product-demo-browser.py
          PUBLIC_LAUNCH_DEMO_URL=http://127.0.0.1:3011/product-demo/ python frontend/tests/public-launch-browser.py
          python packages/components/tests/browser-proof.py
      - name: Retain universal collaboration browser proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-collaboration-browser-proofs
          path: |
            ${{ runner.temp }}/freecollab-universal/collaboration-input/browser.json
            ${{ runner.temp }}/freecollab-universal/collaboration-input/*.png
            ${{ runner.temp }}/freecollab-universal/workbench/browser.json
            ${{ runner.temp }}/freecollab-universal/workbench/*.png
            ${{ runner.temp }}/freecollab-universal/modal/browser.json
            ${{ runner.temp }}/freecollab-universal/modal/*.png
            ${{ runner.temp }}/freecollab-universal/reference-lifetime/browser.json
            ${{ runner.temp }}/freecollab-universal/reference-lifetime/*.png
            ${{ runner.temp }}/freecollab-universal/product/current.json
            ${{ runner.temp }}/freecollab-universal/product/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain open-studio browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: open-studio-browser-failure
          path: |
            ${{ runner.temp }}/freecollab-product-browser/open-studio/**/*.json
            ${{ runner.temp }}/freecollab-product-browser/open-studio/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain personal OAuth browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personal-oauth-browser-failure
          path: |
            ${{ runner.temp }}/freecollab-product-browser/personal-oauth/**/*.json
            ${{ runner.temp }}/freecollab-product-browser/personal-oauth/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload service diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-service-logs
          path: /tmp/freecollab-*.log
          retention-days: 7

  secure-e2e:
    name: Real client encryption and recovery
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:////tmp/freecollab-secure-ci.db
      STORAGE_PATH: /tmp/freecollab-secure-files
      JWT_SECRET: isolated-secure-ci-signing-key-never-use-in-deployment
      MAIL_DELIVERY_MODE: disabled
      MATRIX_ENABLED: "true"
      MATRIX_SERVER_NAME: freecollab.local
      MATRIX_INTERNAL_URL: http://127.0.0.1:18008
      MATRIX_REGISTRATION_SHARED_SECRET: isolated-secure-ci-registration-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked client and browser dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/bin/python -m playwright install --with-deps chromium
          backend/.venv/bin/python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(os.path.join(os.environ['GITHUB_WORKSPACE'], 'backend', '.venv', 'bin') + '\n')
          PY
          npm ci --prefix frontend
          npm ci --prefix packages/components --ignore-scripts
      - name: Start isolated private homeserver
        run: |
          docker --host=unix:///var/run/docker.sock run -d --name freecollab-secure-ci --mount type=volume,src=freecollab-secure-ci-data,dst=/data --mount type=bind,src="$GITHUB_WORKSPACE/scripts/secure-matrix-config.py",dst=/opt/freecollab-init.py,readonly -p 127.0.0.1:18008:8008 --env MATRIX_SERVER_NAME --env MATRIX_REGISTRATION_SHARED_SECRET --entrypoint /bin/sh ghcr.io/element-hq/synapse@sha256:97665cd4539dcf107c69fb6afdb720e1d1c9c09fb2b5701fb13d6c33b22cd8f0 -c 'python /opt/freecollab-init.py && exec /start.py'
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 1 --retry-max-time 90 --connect-timeout 2 --max-time 5 http://127.0.0.1:18008/health
      - name: Start authenticated gateway and client
        run: |
          (cd backend && python -m uvicorn app.main:socket_app --host 127.0.0.1 --port 8000 --no-proxy-headers) > /tmp/freecollab-secure-api.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1 --strictPort) > /tmp/freecollab-secure-web.log 2>&1 &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ready
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/
      - name: Verify two browsers, attachments, recovery and member removal
        run: python scripts/secure-browser-test.py
      - name: Verify encrypted root and reply source navigation
        env:
          SECURE_MESSAGE_NAVIGATION_PROOF_REPORT: ${{ runner.temp }}/freecollab-secure-message-navigation.json
        run: python frontend/tests/secure-message-navigation-browser.py
      - name: Verify lost-device revocation with stale recipient keys
        run: python scripts/secure-device-browser-test.py
      - name: Verify encryption account controls in the real client
        run: python frontend/tests/secure-account-browser.py
      - name: Verify customer SSO scope and native encryption unlock
        run: python scripts/workspace-sso-secure-browser-test.py
      - name: Verify isolated managed identity, recovery and device revocation
        run: python scripts/managed-sso-secure-browser-test.py
      - name: Verify encrypted document links and calendar content
        run: python frontend/tests/document-calendar-browser.py
      - name: Verify encrypted projects and concurrent shared documents
        run: python frontend/tests/shared-documents-browser.py --secure
      - name: Verify packed SDK and isolated embedded customer SSO with real encryption
        env:
          EMBED_PROOF_REPORT: ${{ runner.temp }}/freecollab-sdk-embed/report.json
        run: python packages/components/tests/embed-browser-proof.py --matrix
      - name: Verify encrypted shared channels across managed organizations
        # The preceding embed proof packs into its private fixture directory.
        # Connect deliberately checks the separate reviewed release artifact.
        run: |
          npm run release:artifact --prefix packages/components
          python packages/components/tests/test_sdk_artifact_binding.py
          python packages/components/tests/connect-browser-proof.py --skip-build
      - name: Verify encrypted messages and files across independent installations
        run: BACKEND_PYTHON=python python frontend/tests/connect-federation-browser.py
      - name: Verify shared calendar dates across browser time zones
        run: python frontend/tests/federated-work-calendar-ui-browser.py
      - name: Verify resumable device-encrypted Slack migration
        run: BACKEND_PYTHON=python python frontend/tests/slack-migration-browser.py
      - name: Retain isolated homeserver diagnostics
        if: always()
        run: docker --host=unix:///var/run/docker.sock logs --timestamps freecollab-secure-ci > /tmp/freecollab-secure-synapse.log 2>&1 || true
      - name: Remove only isolated test resources
        if: always()
        run: |
          docker --host=unix:///var/run/docker.sock rm -f freecollab-secure-ci
          docker --host=unix:///var/run/docker.sock volume rm freecollab-secure-ci-data
      - name: Upload service diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secure-e2e-service-logs
          path: /tmp/freecollab-secure-*.log
          retention-days: 7
      - name: Retain encrypted source navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-message-navigation-proofs
          path: |
            ${{ runner.temp }}/freecollab-secure-message-navigation.json
            ${{ runner.temp }}/freecollab-secure-message-navigation*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain embedded SSO failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-sso-failure-proofs
          path: |
            ${{ runner.temp }}/freecollab-sdk-embed/*.json
            ${{ runner.temp }}/freecollab-sdk-embed/*.png
          if-no-files-found: warn
          retention-days: 7

  natural-collaboration-e2e:
    name: Natural collaboration flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKEND_PYTHON: python
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and browser
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          PY
          npm ci --prefix frontend
      - name: Verify reviewed next steps and retained document source
        env:
          NATURAL_COLLABORATION_PROOF_REPORT: ${{ runner.temp }}/freecollab-natural/interaction/report.json
        run: python frontend/tests/natural-collaboration-browser.py
      - name: Verify entry summary and exact source navigation
        env:
          CHANNEL_RETURN_PROOF_REPORT: ${{ runner.temp }}/freecollab-natural/return/report.json
        run: python frontend/tests/channel-return-browser.py
      - name: Verify sample entry summary and retained account isolation
        env:
          CHANNEL_RETURN_DEMO_REPORT: ${{ runner.temp }}/freecollab-natural/demo-return/report.json
        run: python frontend/tests/channel-return-demo-browser.py
      - name: Verify contextual command and reference ordering
        env:
          SUGGESTION_RANKING_REPORT: ${{ runner.temp }}/freecollab-natural/ranking/report.json
        run: python frontend/tests/suggestion-ranking-browser.py
      - name: Verify local organization suggestions and guarded Undo
        env:
          DOCUMENT_ORGANIZATION_PROOF_REPORT: ${{ runner.temp }}/freecollab-natural/organization/report.json
        run: python frontend/tests/document-organization-browser.py
      - name: Retain scoped natural collaboration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-collaboration-proofs
          path: |
            ${{ runner.temp }}/freecollab-natural/**/*.json
            ${{ runner.temp }}/freecollab-natural/**/*.png
          if-no-files-found: warn
          retention-days: 7

  completion-e2e:
    name: Integrated AI, content, apps and capture
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BACKEND_PYTHON: python
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and disposable test tools
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          PY
          npm ci --prefix frontend
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends nginx libflite1
      - name: Verify native links through both actual reverse proxies
        run: python frontend/tests/nginx-native-links.py --nginx /usr/sbin/nginx --mime-types /etc/nginx/mime.types --report "$RUNNER_TEMP/freecollab-completion/nginx/report.json"
      - name: Verify contextual AI, reviewed tools and real runtime execution
        env:
          AI_SURFACE_REPORT: ${{ runner.temp }}/freecollab-completion/ai/report.json
        run: python frontend/tests/ai-surface-browser.py
      - name: Verify content collections, semantic retrieval and anchored comments
        env:
          CONTENT_COMPLETION_REPORT: ${{ runner.temp }}/freecollab-completion/content/report.json
        run: python frontend/tests/content-completion-browser.py
      - name: Verify retained private calendar and exact product resource navigation
        env:
          FLOW_COMPLETION_REPORT: ${{ runner.temp }}/freecollab-completion/flow/report.json
        run: python frontend/tests/flow-completion-browser.py
      - name: Verify installed app review and the actual Chat command paths
        env:
          INSTALLED_APP_REVIEW_REPORT: ${{ runner.temp }}/freecollab-completion/app-review/report.json
          INSTALLED_APP_CHAT_REPORT: ${{ runner.temp }}/freecollab-completion/app-chat/report.json
        run: |
          python frontend/tests/installed-app-command-browser.py
          python frontend/tests/installed-app-chat-browser.py
      - name: Verify sample capture, actual upload, playback and storage isolation
        env:
          MEETING_CAPTURE_PROOF_REPORT: ${{ runner.temp }}/freecollab-completion/capture/report.json
        run: python frontend/tests/meeting-capture-browser.py
      - name: Prepare verified local speech model and verify final caption drain
        run: |
          python scripts/prepare-whisper-model.py --directory "$RUNNER_TEMP/freecollab-whisper-model"
          python frontend/tests/continuous-captions-browser.py --model-directory "$RUNNER_TEMP/freecollab-whisper-model" --report "$RUNNER_TEMP/freecollab-completion/captions/report.json"
      - name: Retain scoped completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-completion-proofs
          path: ${{ runner.temp }}/freecollab-completion/**/report.json
          if-no-files-found: warn
          retention-days: 7

  completion-secure-e2e:
    name: Independent encrypted ${{ matrix.stage }} acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stage: [v2, apps, media, stack-source]
    env:
      ENVIRONMENT: test
      BACKEND_PYTHON: python
      FREECOLLAB_PROOF_RUN_LABEL: ci-${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked client and independently owned federation fixtures
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          PY
          npm ci --prefix frontend
          docker pull ghcr.io/element-hq/synapse@sha256:97665cd4539dcf107c69fb6afdb720e1d1c9c09fb2b5701fb13d6c33b22cd8f0
      - name: Install private TCP relay for actual encrypted media
        if: matrix.stage == 'media'
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends coturn
          echo "MEETINGS_TEST_TURN_BINARY=$(command -v turnserver)" >> "$GITHUB_ENV"
      - name: Verify actual trusted devices across two separate installations
        env:
          FREECOLLAB_PROOF_REPORT_DIR: ${{ runner.temp }}/freecollab-matrix-proof
        run: python frontend/tests/encrypted-work-browser.py --${{ matrix.stage }}-only
      - name: Retain scoped encrypted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-${{ matrix.stage }}-completion-proofs
          path: ${{ runner.temp }}/freecollab-matrix-proof/browser-ci-${{ matrix.stage }}.json
          if-no-files-found: warn
          retention-days: 7

  # Build Docker image
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, product-e2e, secure-e2e, natural-collaboration-e2e, completion-e2e, completion-secure-e2e]
    env:
      # The browser inspects and aborts this owned fixture frame before network.
      PUBLIC_WEBSITE_DEMO_URL: http://127.0.0.1:18082/product-demo/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: freecollab-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: freecollab-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build independent public website image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/website/Dockerfile
          build-args: |
            VITE_PUBLIC_DEMO_URL=${{ env.PUBLIC_WEBSITE_DEMO_URL }}
          push: false
          load: true
          tags: freecollab-website:ci
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install website acceptance browser
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + playwright.chromium.executable_path + '\n')
          PY

      - name: Verify built public website and local demo
        run: |
          docker run -d --name freecollab-public-ci -p 127.0.0.1:18081:8080 freecollab-website:ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --retry-max-time 90 --connect-timeout 2 --max-time 5 http://127.0.0.1:18081/healthz
          python frontend/tests/website-browser.py --base-url http://127.0.0.1:18081 --expected-demo-url "$PUBLIC_WEBSITE_DEMO_URL" --report "$RUNNER_TEMP/freecollab-website-proof.json"

      - name: Retain isolated website startup diagnostics
        if: always()
        run: |
          docker logs --timestamps freecollab-public-ci > "$RUNNER_TEMP/freecollab-website-proof.container.log" 2>&1 || true
          docker inspect --format '{{json .State}}' freecollab-public-ci > "$RUNNER_TEMP/freecollab-website-proof.state.json" 2>&1 || true

      - name: Remove isolated website container
        if: always()
        run: docker rm -f freecollab-public-ci || true

      - name: Retain website acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-website-acceptance
          path: ${{ runner.temp }}/freecollab-website-proof.*
          if-no-files-found: ignore
          retention-days: 7
