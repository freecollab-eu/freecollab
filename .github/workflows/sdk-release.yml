name: SDK release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version, matching package.json
        required: true
        type: string
      publish:
        description: Publish the verified artifact to npm next using the configured trusted publisher
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  artifact:
    name: Verify and pack the SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/components/package-lock.json
      - name: Check release identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('packages/components/package.json','utf8'));
          if(p.version!==process.env.EXPECTED_VERSION || !/^0\.10\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)) throw new Error('Input must match the reviewed 0.10 package version.');
          appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\n');
          JS
      - name: Install the locked standalone package
        working-directory: packages/components
        run: npm ci --ignore-scripts
      - name: Verify public APIs and generate the exact artifact
        working-directory: packages/components
        run: npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-sdk-${{ steps.identity.outputs.version }}
          path: packages/components/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish reviewed SDK bytes
    needs: artifact
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'freecollab-eu/freecollab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: freecollab-sdk-${{ needs.artifact.outputs.version }}
          path: artifact
      - name: Verify manifest and publish with npm OIDC
        env:
          EXPECTED_VERSION: ${{ needs.artifact.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import{readFileSync}from'node:fs';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';
          const m=JSON.parse(readFileSync('artifact/release-manifest.json','utf8'));
          if(m.name!=='@freecollab/components'||m.version!==process.env.EXPECTED_VERSION||!/^freecollab-components-0\.10\.\d+(?:-[0-9A-Za-z.-]+)?\.tgz$/.test(m.artifact)||m.publishTag!=='next'||m.registry!=='https://registry.npmjs.org/')throw new Error('Unexpected release identity.');
          const p='artifact/'+m.artifact,b=readFileSync(p);
          if(createHash('sha256').update(b).digest('hex')!==m.sha256||'sha512-'+createHash('sha512').update(b).digest('base64')!==m.integrity)throw new Error('Artifact integrity failed.');
          execFileSync('npm',['publish',p,'--access','public','--provenance','--tag','next','--ignore-scripts'],{stdio:'inherit'});
          JS
