services:
  frontend:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-frontend:${FREECOLLAB_IMAGE_TAG:-pilot}
    build:
      context: ./frontend
      secrets: [proxy_ca]
      args:
        VITE_WHISPER_MODEL_BASE_PATH: ${VITE_WHISPER_MODEL_BASE_PATH:-}
    ports:
      - "127.0.0.1:${PILOT_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-backend:${FREECOLLAB_IMAGE_TAG:-pilot}
    build:
      context: ./backend
      secrets: [proxy_ca]
    environment: &backend_environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-freecollab}:${POSTGRES_PASSWORD:?Run scripts/pilot-init.py first}@db:5432/${POSTGRES_DB:-freecollab}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/pilot-init.py first}
      ACCOUNT_SECURITY_KEY: ${ACCOUNT_SECURITY_KEY:?Run scripts/pilot-init.py first; upgrade instructions are in docs/AUTH_SESSIONS.md}
      ACCOUNT_SECURITY_KEY_FILE: /data/security/account-security.key
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:8080}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
      MAIL_FILE_PATH: /data/mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-FreeCollab <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Organization SSO}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_TRUST_EMAIL_CLAIM: ${OIDC_TRUST_EMAIL_CLAIM:-false}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-false}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-true}
      DATA_CONTROLS_ENABLED: ${DATA_CONTROLS_ENABLED:-true}
      ACTIVITY_FEEDS_ENABLED: ${ACTIVITY_FEEDS_ENABLED:-true}
      CLOUD_FILES_ENABLED: ${CLOUD_FILES_ENABLED:-false}
      EXTERNAL_MEETINGS_ENABLED: ${EXTERNAL_MEETINGS_ENABLED:-false}
      COPILOT_ENABLED: ${COPILOT_ENABLED:-false}
      FREECOLLAB_AI_PRIVATE_ORIGINS: ${FREECOLLAB_AI_PRIVATE_ORIGINS:-[]}
      FREECOLLAB_AI_TOOL_PRIVATE_ORIGINS: ${FREECOLLAB_AI_TOOL_PRIVATE_ORIGINS:-[]}
      NATIVE_APPLICATION_ID: ${NATIVE_APPLICATION_ID:-}
      NATIVE_APPLE_TEAM_ID: ${NATIVE_APPLE_TEAM_ID:-}
      NATIVE_ANDROID_CERT_SHA256: ${NATIVE_ANDROID_CERT_SHA256:-}
      MEETING_CAPTION_MODEL: ${MEETING_CAPTION_MODEL:-onnx-community/whisper-tiny}
      MEETING_CAPTION_MODEL_BASE: ${MEETING_CAPTION_MODEL_BASE:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      NATIVE_PUSH_ENABLED: ${NATIVE_PUSH_ENABLED:-false}
      NATIVE_CALLS_ENABLED: ${NATIVE_CALLS_ENABLED:-false}
      NATIVE_PUSH_FCM_PROJECT_ID: ${NATIVE_PUSH_FCM_PROJECT_ID:-}
      NATIVE_PUSH_FCM_SERVICE_ACCOUNT: ${NATIVE_PUSH_FCM_SERVICE_ACCOUNT:-}
      NATIVE_PUSH_APNS_TEAM_ID: ${NATIVE_PUSH_APNS_TEAM_ID:-}
      NATIVE_PUSH_APNS_KEY_ID: ${NATIVE_PUSH_APNS_KEY_ID:-}
      NATIVE_PUSH_APNS_TOPIC: ${NATIVE_PUSH_APNS_TOPIC:-eu.freecollab.mobile}
      NATIVE_PUSH_APNS_PRIVATE_KEY: ${NATIVE_PUSH_APNS_PRIVATE_KEY:-}
      NATIVE_PUSH_APNS_SANDBOX: ${NATIVE_PUSH_APNS_SANDBOX:-false}
      MEETINGS_ICE_SERVERS: ${MEETINGS_ICE_SERVERS:-[]}
      MEETINGS_TURN_URLS: ${MEETINGS_TURN_URLS:-[]}
      MEETINGS_TURN_SECRET: ${MEETINGS_TURN_SECRET:-}
      MEETINGS_SFU_PROVIDER: ${MEETINGS_SFU_PROVIDER:-disabled}
      MEETINGS_SFU_URL: ${MEETINGS_SFU_URL:-}
      MEETINGS_SFU_API_URL: ${MEETINGS_SFU_API_URL:-}
      MEETINGS_SFU_API_KEY: ${MEETINGS_SFU_API_KEY:-}
      MEETINGS_SFU_API_SECRET: ${MEETINGS_SFU_API_SECRET:-}
      MEETINGS_SFU_MAX_PARTICIPANTS: ${MEETINGS_SFU_MAX_PARTICIPANTS:-100}
      ENTERPRISE_SEARCH_ENABLED: ${ENTERPRISE_SEARCH_ENABLED:-true}
      SEMANTIC_OPENSEARCH_URL: ${SEMANTIC_OPENSEARCH_URL:-}
      SEMANTIC_OPENSEARCH_INDEX: ${SEMANTIC_OPENSEARCH_INDEX:-freecollab-semantic-v1}
      SEMANTIC_OPENSEARCH_USERNAME: ${SEMANTIC_OPENSEARCH_USERNAME:-}
      SEMANTIC_OPENSEARCH_PASSWORD: ${SEMANTIC_OPENSEARCH_PASSWORD:-}
      SEMANTIC_OPENSEARCH_CA_BUNDLE: ${SEMANTIC_OPENSEARCH_CA_BUNDLE:-}
      SEMANTIC_OPENSEARCH_TIMEOUT: ${SEMANTIC_OPENSEARCH_TIMEOUT:-8}
      ENTERPRISE_VAULT_URL: ${ENTERPRISE_VAULT_URL:-}
      ENTERPRISE_VAULT_TOKEN: ${ENTERPRISE_VAULT_TOKEN:-}
      ENTERPRISE_VAULT_MOUNT: ${ENTERPRISE_VAULT_MOUNT:-transit}
      ENTERPRISE_VAULT_KEY: ${ENTERPRISE_VAULT_KEY:-freecollab}
      ENTERPRISE_VAULT_NAMESPACE: ${ENTERPRISE_VAULT_NAMESPACE:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-freecollab}
      REDIS_TLS_REQUIRED: ${REDIS_TLS_REQUIRED:-true}
      REDIS_PRESENCE_LEASE_SECONDS: ${REDIS_PRESENCE_LEASE_SECONDS:-75}
      OTRUST_ENABLED: ${OTRUST_ENABLED:-false}
      OTRUST_BASE_URL: ${OTRUST_BASE_URL:-https://www.otrust.eu}
      OTRUST_TIMEOUT_SECONDS: ${OTRUST_TIMEOUT_SECONDS:-10}
      OPERATIONS_METRICS_TOKEN: ${OPERATIONS_METRICS_TOKEN:-}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-90}
      SECURITY_AUDIT_MAX_RECORDS: ${SECURITY_AUDIT_MAX_RECORDS:-100000}
      MATRIX_ENABLED: ${MATRIX_ENABLED:-false}
      MATRIX_INTERNAL_URL: http://matrix:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-freecollab.local}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-}
      CONNECT_FEDERATION_ENABLED: ${CONNECT_FEDERATION_ENABLED:-false}
      CONNECT_FEDERATION_PUBLIC_URL: ${CONNECT_FEDERATION_PUBLIC_URL:-}
      CONNECT_FEDERATION_PEERS: ${CONNECT_FEDERATION_PEERS:-{}}
      MESSAGE_ENCRYPTION_KEYS: ${MESSAGE_ENCRYPTION_KEYS:?Run scripts/pilot-init.py first}
      MESSAGE_ENCRYPTION_ACTIVE_KEY_ID: ${MESSAGE_ENCRYPTION_ACTIVE_KEY_ID:-pilot-1}
      LEGACY_MESSAGE_ENCRYPTION_KEY: ${LEGACY_MESSAGE_ENCRYPTION_KEY:-}
      STORAGE_PATH: /data/files
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-freecollab/}
      S3_CA_BUNDLE: ${S3_CA_BUNDLE:-}
      S3_ALLOW_INSECURE_HTTP: ${S3_ALLOW_INSECURE_HTTP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      # Backend has no host port; only the private network proxy can reach it.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - files:/data/files
      - mail:/data/mail
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mail-worker:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-backend:${FREECOLLAB_IMAGE_TAG:-pilot}
    profiles: [mail]
    command: ["python", "-m", "app.services.mail"]
    environment: *backend_environment
    volumes:
      - mail:/data/mail
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  matrix:
    image: ghcr.io/element-hq/synapse@sha256:97665cd4539dcf107c69fb6afdb720e1d1c9c09fb2b5701fb13d6c33b22cd8f0
    profiles: [secure]
    entrypoint: ["/bin/sh", "-c"]
    command: ["python /opt/freecollab/secure-matrix-config.py && exec /start.py"]
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-freecollab.local}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-}
      MATRIX_FEDERATION_DOMAINS: ${MATRIX_FEDERATION_DOMAINS:-[]}
    volumes:
      - matrix:/data
      - ./scripts/secure-matrix-config.py:/opt/freecollab/secure-matrix-config.py:ro
    # No host listener: the authenticated API gateway is the only client entry.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-runtime-worker:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-backend:${FREECOLLAB_IMAGE_TAG:-pilot}
    # Independent lane: a slow model request must not hold reminders or app jobs.
    command: ["python", "-m", "app.services.ai_runtime_worker"]
    environment: *backend_environment
    volumes:
      - files:/data/files
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  integration-worker:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-backend:${FREECOLLAB_IMAGE_TAG:-pilot}
    # Core scheduled messages and reminders need this worker in every install.
    command: ["python", "-m", "app.services.integration_worker"]
    environment: *backend_environment
    volumes:
      - files:/data/files
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  sfu-worker:
    image: ${FREECOLLAB_IMAGE_PREFIX:-freecollab}-backend:${FREECOLLAB_IMAGE_TAG:-pilot}
    profiles: [large-meetings]
    command: ["python", "-m", "app.services.sfu_worker"]
    environment: *backend_environment
    volumes:
      - files:/data/files
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freecollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/pilot-init.py first}
      POSTGRES_DB: ${POSTGRES_DB:-freecollab}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres:
  files:
  mail:
  matrix:

secrets:
  # Public trust bundle only. BuildKit mounts it without retaining it in images.
  proxy_ca:
    file: ${PILOT_BUILD_CA:-/etc/ssl/certs/ca-certificates.crt}
