name: Customer-signed native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed source version, without v
        required: true
        type: string
      installation:
        description: Customer's public HTTPS installation origin
        required: true
        default: https://freecollab.eu
        type: string
      application_id:
        description: Customer mobile bundle/application ID matching Firebase and Apple profiles
        required: true
        default: eu.freecollab.mobile
        type: string
      target:
        description: Build one configured signing identity or all
        required: true
        default: android
        type: choice
        options: [android, ios, desktop-windows, desktop-macos, all]

permissions:
  contents: read

concurrency:
  group: native-signed-${{ inputs.version }}-${{ inputs.application_id }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  identity:
    name: Reviewed source and build identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require clean versions and successful CI for this exact commit
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          MOBILE_APPLICATION_ID: ${{ inputs.application_id }}
          FREECOLLAB_APP_URL: ${{ inputs.installation }}
        run: |
          case "$GITHUB_REF" in refs/heads/main|refs/tags/v"$RELEASE_VERSION") ;; *) exit 1;; esac
          python scripts/release.py check --version "$RELEASE_VERSION" --require-clean --require-ci --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          value=os.environ['MOBILE_APPLICATION_ID']
          if len(value)>200 or not re.fullmatch(r'[A-Za-z][A-Za-z0-9]*(?:\.[A-Za-z][A-Za-z0-9]*){2,}',value): raise SystemExit('Invalid mobile application ID')
          origin=os.environ['FREECOLLAB_APP_URL'];p=urlsplit(origin)
          if len(origin)>2048 or any(c.isspace() for c in origin) or p.scheme!='https' or not p.hostname or p.username or p.password or p.path not in ('','/') or p.query or p.fragment: raise SystemExit('Invalid HTTPS installation origin')
          PY

  desktop-windows:
    name: Authenticode Windows x64
    if: inputs.target == 'all' || inputs.target == 'desktop-windows'
    needs: identity
    runs-on: windows-latest
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Build with the configured customer code-signing certificate
        working-directory: clients/desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_P12_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD) { throw 'Windows signing identity is not configured in native-release.' }
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run dist -- --win --x64 --config.forceCodeSigning=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify every public Windows executable and its trust chain
        shell: pwsh
        run: |
          $files = @(Get-ChildItem clients/desktop/dist -Filter *.exe)
          if (!$files.Count) { throw 'No signed Windows release was produced.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed for $($file.Name)." }
          }
      - name: Hash verified installer bytes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python scripts/release.py assets clients/desktop/dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --platform windows-x64 --signing windows-authenticode-verified --output clients/desktop/dist/native-release.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            clients/desktop/dist/*.exe
            clients/desktop/dist/native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-${{ needs.identity.outputs.version }}-windows-x64-signed
          path: |
            clients/desktop/dist/*.exe
            clients/desktop/dist/native-release.json
            clients/desktop/dist/SHA256SUMS
          if-no-files-found: error

  desktop-macos:
    name: Notarized macOS ${{ matrix.arch }}
    if: inputs.target == 'all' || inputs.target == 'desktop-macos'
    needs: identity
    runs-on: macos-15
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Build, sign and notarize with the configured customer identity
        working-directory: clients/desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" || { echo 'macOS signing/notarization identity is not configured in native-release.' >&2; exit 1; }
          export APPLE_API_KEY="$RUNNER_TEMP/freecollab-notary.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          python - <<'PY'
          import os,pathlib,base64
          p=pathlib.Path(os.environ['APPLE_API_KEY']);p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_BASE64'],validate=True));p.chmod(0o600)
          PY
          npm ci
          npm test
          npm run dist -- --mac "--$BUILD_ARCH" --config.forceCodeSigning=true --config.mac.notarize=true
      - name: Verify the actual app signature and notarization ticket
        run: |
          set -euo pipefail
          app_count=$(find clients/desktop/dist -maxdepth 2 -name FreeCollab.app -type d | wc -l | tr -d ' ')
          test "$app_count" = 1
          app=$(find clients/desktop/dist -maxdepth 2 -name FreeCollab.app -type d)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Hash notarized public artifacts
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: python scripts/release.py assets clients/desktop/dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --platform "macos-$BUILD_ARCH" --signing apple-notarized --output clients/desktop/dist/native-release.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            clients/desktop/dist/*.dmg
            clients/desktop/dist/*.zip
            clients/desktop/dist/native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-${{ needs.identity.outputs.version }}-macos-${{ matrix.arch }}-notarized
          path: |
            clients/desktop/dist/*.dmg
            clients/desktop/dist/*.zip
            clients/desktop/dist/native-release.json
            clients/desktop/dist/SHA256SUMS
          if-no-files-found: error

  android:
    name: Customer-signed Android APK and AAB
    if: inputs.target == 'all' || inputs.target == 'android'
    needs: identity
    runs-on: ubuntu-latest
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Configure customer identity and build unsigned release inputs
        working-directory: clients/mobile
        env:
          FREECOLLAB_APP_URL: ${{ inputs.installation }}
          FREECOLLAB_APPLICATION_ID: ${{ inputs.application_id }}
          MOBILE_APPLICATION_ID: ${{ inputs.application_id }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo 'Customer Firebase configuration is required for the signed push-enabled release.' >&2; exit 1; }
          python - <<'PY'
          import os,base64,json,pathlib
          payload=base64.b64decode(os.environ['GOOGLE_SERVICES_JSON_BASE64'],validate=True);data=json.loads(payload)
          identifier=os.environ['MOBILE_APPLICATION_ID']
          if identifier not in {c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])}: raise SystemExit('Firebase application ID does not match this build.')
          pathlib.Path('android/app/google-services.json').write_bytes(payload)
          PY
          npm ci
          npm test
          npm run sync
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Sign exact APK/AAB and verify the supplied certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Android signing identity is not configured in native-release.' >&2; exit 1; }
          export RELEASE_KEYSTORE="$RUNNER_TEMP/freecollab-release.jks"
          trap 'rm -f "$RELEASE_KEYSTORE"' EXIT
          python - <<'PY'
          import os,pathlib,base64
          p=pathlib.Path(os.environ['RELEASE_KEYSTORE']);p.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True));p.chmod(0o600)
          PY
          mkdir -p native-release
          keytool -exportcert -keystore "$RELEASE_KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/freecollab-signer.der" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 clients/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/freecollab-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RELEASE_KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v4-signing-enabled false --out "native-release/FreeCollab-$RELEASE_VERSION.apk" "$RUNNER_TEMP/freecollab-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "native-release/FreeCollab-$RELEASE_VERSION.apk" > "$RUNNER_TEMP/freecollab-apk-verified.txt"
          cp clients/mobile/android/app/build/outputs/bundle/release/app-release.aab "native-release/FreeCollab-$RELEASE_VERSION.aab"
          jarsigner -keystore "$RELEASE_KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD "native-release/FreeCollab-$RELEASE_VERSION.aab" "$ANDROID_KEY_ALIAS"
          jarsigner -J-Duser.language=en -verify "native-release/FreeCollab-$RELEASE_VERSION.aab" > "$RUNNER_TEMP/freecollab-aab-verified.txt"
          keytool -printcert -jarfile "native-release/FreeCollab-$RELEASE_VERSION.aab" -rfc > "$RUNNER_TEMP/freecollab-aab-signer.pem"
          openssl x509 -in "$RUNNER_TEMP/freecollab-aab-signer.pem" -outform DER -out "$RUNNER_TEMP/freecollab-aab-signer.der"
          python - <<'PY'
          import os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);cert=(root/'freecollab-signer.der').read_bytes()
          expected=hashlib.sha256(cert).hexdigest()
          if 'Signer #1 certificate SHA-256 digest: '+expected not in (root/'freecollab-apk-verified.txt').read_text(): raise SystemExit('APK signer differs from the configured key.')
          if (root/'freecollab-aab-signer.der').read_bytes()!=cert or 'jar verified.' not in (root/'freecollab-aab-verified.txt').read_text(): raise SystemExit('AAB signature verification failed.')
          PY
      - name: Hash signed public artifacts
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          FREECOLLAB_APP_URL: ${{ inputs.installation }}
          MOBILE_APPLICATION_ID: ${{ inputs.application_id }}
        run: python scripts/release.py assets native-release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --platform android --signing android-apksigner-verified --installation "$FREECOLLAB_APP_URL" --application-id "$MOBILE_APPLICATION_ID" --output native-release/native-release.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            native-release/*.apk
            native-release/*.aab
            native-release/native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-${{ needs.identity.outputs.version }}-android-signed
          path: native-release/
          if-no-files-found: error

  ios:
    name: Customer-signed iOS archive and IPA
    if: inputs.target == 'all' || inputs.target == 'ios'
    needs: identity
    runs-on: macos-15
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - name: Configure the customer installation
        working-directory: clients/mobile
        env:
          FREECOLLAB_APP_URL: ${{ inputs.installation }}
          FREECOLLAB_APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          npm ci
          npm test
          npm run sync
      - name: Install temporary customer signing identity, archive and export
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          MOBILE_APPLICATION_ID: ${{ inputs.application_id }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$IOS_SIGNING_P12_BASE64" && test -n "$IOS_SIGNING_P12_PASSWORD" && test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo 'iOS distribution identity/profile is not configured in native-release.' >&2; exit 1; }
          export SIGNING_DIR="$RUNNER_TEMP/freecollab-ios-signing"
          mkdir -m 700 "$SIGNING_DIR"
          export SIGNING_KEYCHAIN="$SIGNING_DIR/signing.keychain-db"
          export KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          profile_path=''
          cleanup() {
            security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
            if [ -n "$profile_path" ]; then rm -f "$profile_path"; fi
            rm -rf "$SIGNING_DIR"
          }
          trap cleanup EXIT
          python - <<'PY'
          import os,pathlib,base64
          root=pathlib.Path(os.environ['SIGNING_DIR'])
          for name,key in [('identity.p12','IOS_SIGNING_P12_BASE64'),('profile.mobileprovision','IOS_PROVISIONING_PROFILE_BASE64')]:
              path=root/name;path.write_bytes(base64.b64decode(os.environ[key],validate=True));path.chmod(0o600)
          PY
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          openssl pkcs12 -in "$SIGNING_DIR/identity.p12" -passin env:IOS_SIGNING_P12_PASSWORD -clcerts -nokeys -out "$SIGNING_DIR/certificate.pem"
          openssl x509 -in "$SIGNING_DIR/certificate.pem" -outform DER -out "$SIGNING_DIR/certificate.der"
          python - <<'PY'
          import os,pathlib,plistlib,hashlib,datetime,re
          root=pathlib.Path(os.environ['SIGNING_DIR']);profile=plistlib.loads((root/'profile.plist').read_bytes())
          identifier=os.environ['MOBILE_APPLICATION_ID'];team=profile['TeamIdentifier'][0];uuid=profile['UUID'];ent=profile['Entitlements']
          if not re.fullmatch(r'[A-Za-z0-9-]{16,64}',uuid) or not re.fullmatch(r'[A-Z0-9]{10}',team): raise SystemExit('Invalid provisioning identity.')
          if ent.get('application-identifier')!=team+'.'+identifier or ent.get('get-task-allow') or ent.get('aps-environment')!='production': raise SystemExit('A matching production push-enabled distribution profile is required.')
          if profile['ExpirationDate']<=datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None): raise SystemExit('Provisioning profile is expired.')
          cert=(root/'certificate.der').read_bytes()
          if cert not in profile.get('DeveloperCertificates',[]): raise SystemExit('Signing certificate is not authorized by this profile.')
          method='release-testing' if profile.get('ProvisionedDevices') else 'app-store-connect'
          if profile.get('ProvisionsAllDevices'): method='enterprise'
          options={'method':method,'signingStyle':'manual','teamID':team,'signingCertificate':hashlib.sha1(cert).hexdigest().upper(),'provisioningProfiles':{identifier:uuid}}
          (root/'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          (root/'team').write_text(team);(root/'uuid').write_text(uuid);(root/'certificate-sha1').write_text(options['signingCertificate'])
          PY
          profile_uuid=$(cat "$SIGNING_DIR/uuid")
          team_id=$(cat "$SIGNING_DIR/team")
          certificate_identity=$(cat "$SIGNING_DIR/certificate-sha1")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          candidate_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          test ! -e "$candidate_profile"
          cp "$SIGNING_DIR/profile.mobileprovision" "$candidate_profile"
          profile_path="$candidate_profile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_DIR/identity.p12" -P "$IOS_SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          mkdir -p native-release
          xcodebuild -project clients/mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FreeCollab.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$team_id" CODE_SIGN_IDENTITY="$certificate_identity" PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" PRODUCT_BUNDLE_IDENTIFIER="$MOBILE_APPLICATION_ID" APNS_ENVIRONMENT=production OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FreeCollab.xcarchive" -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" -exportPath "$RUNNER_TEMP/freecollab-ipa"
          codesign --verify --deep --strict "$RUNNER_TEMP/FreeCollab.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$RUNNER_TEMP/FreeCollab.xcarchive/Products/Applications/App.app" > "$SIGNING_DIR/actual-entitlements.plist" 2>/dev/null
          python - <<'PY'
          import os,pathlib,plistlib
          root=pathlib.Path(os.environ['SIGNING_DIR']);ent=plistlib.loads((root/'actual-entitlements.plist').read_bytes())
          if ent.get('application-identifier')!=(root/'team').read_text()+'.'+os.environ['MOBILE_APPLICATION_ID'] or ent.get('aps-environment')!='production' or ent.get('get-task-allow'): raise SystemExit('Archived app signing entitlements do not match the customer distribution identity.')
          files=list((pathlib.Path(os.environ['RUNNER_TEMP'])/'freecollab-ipa').glob('*.ipa'))
          if len(files)!=1: raise SystemExit('Expected exactly one exported IPA.')
          (root/'ipa-path').write_text(str(files[0]))
          PY
          ipa=$(cat "$SIGNING_DIR/ipa-path")
          unzip -q "$ipa" -d "$SIGNING_DIR/exported"
          codesign --verify --deep --strict "$SIGNING_DIR/exported/Payload/App.app"
          codesign -d --entitlements :- "$SIGNING_DIR/exported/Payload/App.app" > "$SIGNING_DIR/exported-entitlements.plist" 2>/dev/null
          codesign -d --extract-certificates "$SIGNING_DIR/exported-signer-" "$SIGNING_DIR/exported/Payload/App.app" 2>/dev/null
          python - <<'PY'
          import os,pathlib,plistlib
          root=pathlib.Path(os.environ['SIGNING_DIR']);ent=plistlib.loads((root/'exported-entitlements.plist').read_bytes())
          if ent.get('application-identifier')!=(root/'team').read_text()+'.'+os.environ['MOBILE_APPLICATION_ID'] or ent.get('aps-environment')!='production' or ent.get('get-task-allow'): raise SystemExit('Exported IPA signing entitlements do not match.')
          if (root/'exported-signer-0').read_bytes()!=(root/'certificate.der').read_bytes(): raise SystemExit('Exported IPA certificate differs from the configured identity.')
          pathlib.Path((root/'ipa-path').read_text()).replace(pathlib.Path('native-release')/('FreeCollab-'+os.environ['RELEASE_VERSION']+'.ipa'))
          PY
      - name: Hash verified distribution IPA
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          FREECOLLAB_APP_URL: ${{ inputs.installation }}
          MOBILE_APPLICATION_ID: ${{ inputs.application_id }}
        run: python scripts/release.py assets native-release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --platform ios --signing apple-distribution-verified --installation "$FREECOLLAB_APP_URL" --application-id "$MOBILE_APPLICATION_ID" --output native-release/native-release.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            native-release/*.ipa
            native-release/native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: freecollab-${{ needs.identity.outputs.version }}-ios-distribution-signed
          path: native-release/
          if-no-files-found: error
