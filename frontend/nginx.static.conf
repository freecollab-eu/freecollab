# Standalone static deployment selected by an explicit VITE_API_URL build arg.
# Requests go directly to that configured API origin; no backend DNS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Raw URLs can contain capabilities even on a standalone static host.
    # Rejection/normalization can happen before any location is selected.
    access_log off;
    error_log /dev/null emerg;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # PDF.js uses an ES module worker. Nginx's default MIME map omits .mjs.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/embed-entry\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /service-worker.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
